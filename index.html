<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToyModel · 全国模拟POI可视化</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{--bg:#0b0e14;--panel:#141a26;--border:#2a3448;--text:#e6edf3;--muted:#8b98ab;--brand:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
header{padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:16px;display:flex;align-items:baseline;gap:14px}
h1{font-size:22px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.badge{background:rgba(88,166,255,.15);color:var(--brand);font-size:11px;padding:2px 8px;border-radius:99px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar label{color:var(--muted);font-size:13px}
select,input{background:#1b2436;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
#map{width:100%;height:70vh;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--brand);font-variant-numeric:tabular-nums}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.tutorial-link{margin-left:auto;color:var(--brand);text-decoration:none;font-size:13px;border:1px solid rgba(88,166,255,.4);padding:4px 12px;border-radius:99px;white-space:nowrap}
.tutorial-link:hover{background:rgba(88,166,255,.12)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>ToyModel · 全国模拟 POI <span class="badge">模拟数据</span></h1>
  <div class="sub">按 2013-2023 全国 POI 真实分布(省规模/分类占比)生成的轻量模拟数据</div>
  <a href="tutorial.html" class="tutorial-link">入门教程 →</a>
</header>

<div class="toolbar">
  <label>分类</label>
  <select id="selCat"></select>
  <label>省份</label>
  <select id="selProv"><option value="">全部省份</option></select>
  <label>密度</label>
  <input type="range" id="dens" min="1" max="10" value="3" style="width:140px">
  <span id="densLbl" class="sub" style="font-size:12px"></span>
</div>

<div id="map"></div>

<div class="stats">
  <div class="stat"><b id="sCount">0</b>当前展示点</div>
  <div class="stat"><b id="sTotal">0</b>模拟点总数</div>
  <div class="stat"><b>17</b>标准分类</div>
  <div class="stat"><b>34</b>省级区域</div>
</div>

<footer>
  数据说明：本页为 <strong>模拟演示</strong>，坐标/名称为合成，仅用于可视化原型验证；非真实 POI。
  生成基于 2013-2023 全国数据湖实测的省规模占比与分类分布。GitHub Pages 部署。
</footer>
</div>

<script>
let DATA, CHINA = null;
const chart = echarts.init(document.getElementById('map'));
const selCat = document.getElementById('selCat');
const selProv = document.getElementById('selProv');
const dens = document.getElementById('dens');

// 简称 -> 全称 (与 china_mainland.json 的 name 一致)
const PROV_FULL = {"上海":"上海市","云南":"云南省","内蒙古":"内蒙古自治区","北京":"北京市","台湾":"台湾省","吉林":"吉林省","四川":"四川省","天津":"天津市","宁夏":"宁夏回族自治区","安徽":"安徽省","山东":"山东省","山西":"山西省","广东":"广东省","广西":"广西壮族自治区","新疆":"新疆维吾尔自治区","江苏":"江苏省","江西":"江西省","河北":"河北省","河南":"河南省","浙江":"浙江省","海南":"海南省","湖北":"湖北省","湖南":"湖南省","澳门":"澳门特别行政区","甘肃":"甘肃省","福建":"福建省","西藏":"西藏自治区","贵州":"贵州省","辽宁":"辽宁省","重庆":"重庆市","陕西":"陕西省","青海":"青海省","香港":"香港特别行政区","黑龙江":"黑龙江省"};

Promise.all([
  fetch('poi_sim.json').then(r=>r.json()),
  fetch('china_mainland.json').then(r=>r.json())
]).then(([d, geo])=>{
  DATA = d;
  CHINA = geo;
  echarts.registerMap('china', geo);
  document.getElementById('sTotal').textContent = d.meta.n;
  d.meta.cats.forEach((c,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=c; selCat.appendChild(o); });
  selProv.appendChild(new Option('全部省份', ''));  // 全称在后? 先放空选项
  d.meta.provinces.forEach((p,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=PROV_FULL[p]||p; selProv.appendChild(o); });
  render(); window.addEventListener('resize',()=>chart.resize());
});

function render(){
  if(!DATA) return;
  const provIdx = selProv.value === '' ? -1 : parseInt(selProv.value);
  const catIdx = selCat.value === '' ? -1 : parseInt(selCat.value);
  const step = parseInt(dens.value);
  const pts = [];
  let count = 0;
  DATA.points.forEach(p=>{
    if(provIdx>=0 && p[0]!==provIdx) return;
    if(catIdx>=0 && p[2]!==catIdx) return;
    count++;
    if(count % step !== 0) return;
    const provName = PROV_FULL[DATA.meta.provinces[p[0]]] || DATA.meta.provinces[p[0]];
    pts.push({name:p[1], value:[p[3],p[4], p[1]+' · '+DATA.meta.cats[p[2]]+' · '+provName]});
  });
  document.getElementById('sCount').textContent = pts.length;
  chart.setOption({
    tooltip:{formatter:p=>`<b>${p.data.name}</b><br>${p.value[2]}`},
    geo:{map:'china', roam:true,
      itemStyle:{areaColor:'#1b2436',borderColor:'#3a4659'},
      emphasis:{itemStyle:{areaColor:'#243250'},label:{show:false}},
      label:{show:false}},
    series:[{type:'scatter', coordinateSystem:'geo',
      data:pts,
      symbolSize:4,
      itemStyle:{color:'#58a6ff',opacity:.7},
      emphasis:{itemStyle:{color:'#ff6a3d'}}}]
  });
}
dens.addEventListener('input',()=>{document.getElementById('densLbl').textContent=dens.value+'x';render();});
selCat.addEventListener('change',render);
selProv.addEventListener('change',render);
document.getElementById('densLbl').textContent=dens.value+'x';
</script>
</body>
</html>
